<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anime">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Anime</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>Anime <span id="count" class="count"></span></h1>
      <span id="conn" class="conn" hidden title="Not connected"></span>
      <button class="icon-btn" id="btn-undo" aria-label="Undo last action" disabled></button>
      <button class="icon-btn" id="btn-manage" aria-label="Manage series"></button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings"></button>
    </div>
  </header>

  <main id="main">
    <div id="notices"></div>
    <div id="list"></div>
  </main>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="boot">
    <div class="spinner"></div>
    <p id="boot-stage">Starting…</p>
  </div>

  <script type="module" src="app.js?v=5"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
