name: Anime-Widget Server
version: "0.1.2"
slug: anime_widget_server
description: Shared episode checklist + MyAnimeList sync for the Anime-Widget desktop widget, app and phone.
url: https://github.com/KaKuna285/Anime-Widget
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: Anime
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API for the desktop widget/app (and later the phone web app)
options:
  mal_client_id: ""
  api_token: ""
schema:
  mal_client_id: str?
  api_token: password?
